<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 Libgen Arama</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f0f13;color:#e0e0e0;min-height:100vh}
#header{background:#1a1a24;border-bottom:1px solid #2a2a3a;padding:16px 20px;display:flex;align-items:center;gap:12px}
#header h1{font-size:20px;color:#fff}
#header span{font-size:12px;color:#888}
#search-box{padding:16px 20px;background:#141420;border-bottom:1px solid #2a2a3a}
#search-row{display:flex;gap:8px;margin-bottom:10px}
#q{flex:1;padding:12px 16px;font-size:16px;border:1px solid #2a2a3a;border-radius:10px;background:#1e1e2e;color:#fff;outline:none}
#q:focus{border-color:#6c63ff}
#btn-search{padding:12px 20px;background:#6c63ff;color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;white-space:nowrap}
#btn-search:hover{background:#5a52e0}
#filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select{padding:7px 10px;background:#1e1e2e;color:#ccc;border:1px solid #2a2a3a;border-radius:8px;font-size:13px;outline:none}
#status{padding:10px 20px;font-size:13px;color:#888;min-height:36px;display:flex;align-items:center;gap:8px}

/* Toolbar */
#toolbar{display:none;padding:10px 20px;background:#141420;border-bottom:1px solid #2a2a3a;gap:8px;flex-wrap:wrap;align-items:center}
#toolbar.visible{display:flex}
.tb-btn{padding:7px 14px;border:none;border-radius:8px;font-size:13px;cursor:pointer;font-weight:600}
#btn-select-all{background:#2a2a3a;color:#ccc}
#btn-select-all:hover{background:#3a3a4a}
#btn-deselect{background:#2a2a3a;color:#ccc}
#btn-deselect:hover{background:#3a3a4a}
#btn-dl-selected{background:#2d5a2d;color:#6dbf6d;border:1px solid #3d7a3d}
#btn-dl-selected:hover{background:#3d6a3d}
#btn-dl-selected:disabled{opacity:.4;cursor:not-allowed}
#btn-dl-all{background:#2a3a5a;color:#6d9dbf;border:1px solid #3d5a7a}
#btn-dl-all:hover{background:#3a4a6a}
#sel-count{font-size:13px;color:#888;margin-left:4px}

#results{padding:0 20px 20px}
.book-card{background:#1a1a24;border:1px solid #2a2a3a;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;transition:border-color .15s}
.book-card.selected{border-color:#6c63ff;background:#1e1e30}
.book-check{width:20px;height:20px;margin-top:2px;flex-shrink:0;cursor:pointer;accent-color:#6c63ff}
.book-body{flex:1;min-width:0}
.book-title{font-size:14px;font-weight:600;color:#fff;margin-bottom:3px;line-height:1.4}
.book-meta{font-size:12px;color:#888;margin-bottom:8px;line-height:1.6}
.book-meta b{color:#aaa}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.badge{padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600}
.badge-ext{background:#2a3a2a;color:#6dbf6d}
.badge-size{background:#2a2a3a;color:#8888cc}
.badge-lang{background:#3a2a2a;color:#cc8888}
.btn-dl{padding:6px 14px;background:#2d5a2d;color:#6dbf6d;border:1px solid #3d7a3d;border-radius:8px;font-size:12px;cursor:pointer}
.btn-dl:hover{background:#3d6a3d}
.btn-dl.loading{opacity:.6;pointer-events:none}
.btn-dl.done{background:#1a3a1a;color:#4a9a4a}

#pagination{display:flex;gap:8px;padding:16px 20px;justify-content:center;align-items:center}
.pg-btn{padding:8px 16px;background:#1e1e2e;border:1px solid #2a2a3a;color:#ccc;border-radius:8px;cursor:pointer;font-size:13px}
.pg-btn:hover{background:#2a2a3a}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.empty{text-align:center;padding:40px;color:#555}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #555;border-top-color:#6c63ff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Progress modal */
#progress-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;align-items:center;justify-content:center}
#progress-modal.show{display:flex}
#progress-box{background:#1a1a24;border:1px solid #2a2a3a;border-radius:16px;padding:24px;width:90%;max-width:400px}
#progress-box h3{font-size:16px;margin-bottom:16px;color:#fff}
#progress-bar-wrap{background:#0f0f13;border-radius:8px;height:10px;margin-bottom:12px;overflow:hidden}
#progress-bar{height:100%;background:#6c63ff;border-radius:8px;transition:width .3s;width:0%}
#progress-text{font-size:13px;color:#888;margin-bottom:16px}
#progress-log{font-size:12px;color:#666;max-height:120px;overflow-y:auto;line-height:1.8}
#btn-cancel-dl{padding:8px 16px;background:#3a2a2a;color:#cc6666;border:1px solid #5a3a3a;border-radius:8px;font-size:13px;cursor:pointer;margin-top:12px}
</style>
</head>
<body>

<div id="header">
  <span style="font-size:24px">📚</span>
  <h1>Library Genesis</h1>
  <span>Kitap Arama & İndirme</span>
</div>

<div id="search-box">
  <div id="search-row">
    <input id="q" type="text" placeholder="Kitap adı, yazar, ISBN..." onkeydown="if(event.key==='Enter')doSearch()">
    <button id="btn-search" onclick="doSearch()">Ara</button>
  </div>
  <div id="filters">
    <select id="field">
      <option value="def">Tümünde ara</option>
      <option value="title">Başlık</option>
      <option value="author">Yazar</option>
      <option value="publisher">Yayınevi</option>
      <option value="isbn">ISBN</option>
    </select>
    <select id="lang">
      <option value="">Tüm diller</option>
      <option value="Turkish">Türkçe</option>
      <option value="English">İngilizce</option>
      <option value="German">Almanca</option>
      <option value="French">Fransızca</option>
    </select>
    <select id="ext">
      <option value="">Tüm formatlar</option>
      <option value="pdf">PDF</option>
      <option value="epub">EPUB</option>
      <option value="mobi">MOBI</option>
      <option value="djvu">DJVU</option>
    </select>
    <select id="res">
      <option value="25">25 sonuç</option>
      <option value="50">50 sonuç</option>
      <option value="100">100 sonuç</option>
    </select>
  </div>
</div>

<div id="status"></div>

<div id="toolbar">
  <button class="tb-btn" id="btn-select-all" onclick="selectAll()">☑ Tümünü Seç</button>
  <button class="tb-btn" id="btn-deselect" onclick="deselectAll()">☐ Seçimi Temizle</button>
  <button class="tb-btn" id="btn-dl-selected" onclick="downloadSelected()" disabled>⬇ Seçilenleri İndir</button>
  <button class="tb-btn" id="btn-dl-all" onclick="downloadAll()">⬇ Tümünü İndir</button>
  <span id="sel-count"></span>
</div>

<div id="results"></div>

<div id="pagination" style="display:none">
  <button class="pg-btn" id="btn-prev" onclick="changePage(-1)">← Önceki</button>
  <span id="pg-info" style="padding:8px 16px;color:#888;font-size:13px"></span>
  <button class="pg-btn" id="btn-next" onclick="changePage(1)">Sonraki →</button>
</div>

<!-- Progress Modal -->
<div id="progress-modal">
  <div id="progress-box">
    <h3 id="progress-title">📥 İndiriliyor...</h3>
    <div id="progress-bar-wrap"><div id="progress-bar"></div></div>
    <div id="progress-text"></div>
    <div id="progress-log"></div>
    <button id="btn-cancel-dl" onclick="cancelDownload()">✕ İptal</button>
  </div>
</div>

<script>
let currentPage = 1;
let currentBooks = [];
let selectedSet = new Set();
let cancelFlag = false;

function doSearch(page) {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  currentPage = page || 1;

  const field = document.getElementById('field').value;
  const lang  = document.getElementById('lang').value;
  const ext   = document.getElementById('ext').value;
  const res   = document.getElementById('res').value;

  document.getElementById('status').innerHTML = '<span class="spinner"></span>Aranıyor...';
  document.getElementById('results').innerHTML = '';
  document.getElementById('pagination').style.display = 'none';
  document.getElementById('toolbar').classList.remove('visible');
  document.getElementById('btn-search').disabled = true;
  selectedSet.clear();

  fetch(`/api/search?q=${encodeURIComponent(q)}&field=${field}&lang=${lang}&ext=${ext}&page=${currentPage}&res=${res}`)
    .then(r => r.json())
    .then(data => {
      document.getElementById('btn-search').disabled = false;
      if (data.error) {
        document.getElementById('status').textContent = '❌ ' + data.error;
        return;
      }
      currentBooks = data.books || [];
      document.getElementById('status').textContent =
        `✓ ${currentBooks.length} sonuç  (Mirror: ${data.mirror})`;

      if (!currentBooks.length) {
        document.getElementById('results').innerHTML =
          '<div class="empty">Sonuç bulunamadı.</div>';
        return;
      }

      renderBooks();
      document.getElementById('toolbar').classList.add('visible');
      document.getElementById('pagination').style.display = 'flex';
      document.getElementById('pg-info').textContent = `Sayfa ${currentPage}`;
      document.getElementById('btn-prev').disabled = currentPage <= 1;
    })
    .catch(e => {
      document.getElementById('btn-search').disabled = false;
      document.getElementById('status').textContent = '❌ ' + e.message;
    });
}

function renderBooks() {
  const container = document.getElementById('results');
  container.innerHTML = currentBooks.map((b, i) => `
    <div class="book-card${selectedSet.has(i) ? ' selected' : ''}" id="card-${i}">
      <input type="checkbox" class="book-check" ${selectedSet.has(i)?'checked':''} 
             onchange="toggleSelect(${i}, this.checked)" ${b.md5||b.mirror_links?.length?'':'disabled'}>
      <div class="book-body">
        <div class="book-title">${esc(b.title)}</div>
        <div class="book-meta">
          ${b.author?`<b>Yazar:</b> ${esc(b.author)}<br>`:''}
          ${b.year?`<b>Yıl:</b> ${b.year}  `:''}
          ${b.language?`<b>Dil:</b> ${b.language}`:''}
        </div>
        <div class="badges">
          ${b.extension?`<span class="badge badge-ext">${b.extension.toUpperCase()}</span>`:''}
          ${b.size?`<span class="badge badge-size">${b.size}</span>`:''}
          ${b.language?`<span class="badge badge-lang">${b.language}</span>`:''}
        </div>
        ${b.md5||b.mirror_links?.length
          ? `<button class="btn-dl" id="dl-${i}" onclick="downloadOne(${i})">⬇ İndir</button>`
          : `<span style="font-size:11px;color:#444">Link yok</span>`}
      </div>
    </div>
  `).join('');
  updateSelCount();
}

function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function toggleSelect(i, checked) {
  if (checked) selectedSet.add(i); else selectedSet.delete(i);
  const card = document.getElementById(`card-${i}`);
  if (card) card.classList.toggle('selected', checked);
  updateSelCount();
}

function selectAll() {
  currentBooks.forEach((b, i) => {
    if (b.md5 || b.mirror_links?.length) {
      selectedSet.add(i);
      const card = document.getElementById(`card-${i}`);
      if (card) {
        card.classList.add('selected');
        card.querySelector('.book-check').checked = true;
      }
    }
  });
  updateSelCount();
}

function deselectAll() {
  selectedSet.clear();
  currentBooks.forEach((_, i) => {
    const card = document.getElementById(`card-${i}`);
    if (card) {
      card.classList.remove('selected');
      const cb = card.querySelector('.book-check');
      if (cb) cb.checked = false;
    }
  });
  updateSelCount();
}

function updateSelCount() {
  const n = selectedSet.size;
  document.getElementById('sel-count').textContent = n > 0 ? `${n} kitap seçili` : '';
  document.getElementById('btn-dl-selected').disabled = n === 0;
}

function buildParams(b) {
  const p = new URLSearchParams({
    md5: b.md5 || '',
    title: b.title || 'kitap',
    ext: b.extension || 'pdf',
  });
  (b.mirror_links || []).forEach(l => p.append('links', l));
  return p;
}

function downloadOne(i) {
  const b = currentBooks[i];
  if (!b) return;
  const btn = document.getElementById(`dl-${i}`);
  if (btn) { btn.textContent = '⏳'; btn.classList.add('loading'); }
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = `/api/download?${buildParams(b)}`;
  document.body.appendChild(iframe);
  setTimeout(() => {
    if (btn) { btn.textContent = '✓ İndirildi'; btn.classList.remove('loading'); btn.classList.add('done'); }
  }, 4000);
}

async function downloadSelected() {
  const indices = [...selectedSet].sort((a,b)=>a-b);
  await batchDownload(indices, 'Seçili Kitaplar');
}

async function downloadAll() {
  const indices = currentBooks.map((_,i)=>i).filter(i => currentBooks[i].md5 || currentBooks[i].mirror_links?.length);
  if (!indices.length) return;
  const ok = confirm(`${indices.length} kitabın tamamı indirilecek. Devam?`);
  if (!ok) return;
  await batchDownload(indices, 'Tüm Liste');
}

async function batchDownload(indices, baslik) {
  if (!indices.length) return;
  cancelFlag = false;
  const modal = document.getElementById('progress-modal');
  const bar   = document.getElementById('progress-bar');
  const txt   = document.getElementById('progress-text');
  const log   = document.getElementById('progress-log');
  document.getElementById('progress-title').textContent = `📥 ${baslik} İndiriliyor...`;
  log.innerHTML = '';
  modal.classList.add('show');

  for (let n = 0; n < indices.length; n++) {
    if (cancelFlag) break;
    const i = indices[n];
    const b = currentBooks[i];
    const pct = Math.round((n / indices.length) * 100);
    bar.style.width = pct + '%';
    txt.textContent = `${n+1} / ${indices.length}  —  ${b.title?.slice(0,40) || ''}`;

    // İndir
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = `/api/download?${buildParams(b)}`;
    document.body.appendChild(iframe);

    log.innerHTML += `<div>✓ ${esc(b.title?.slice(0,50)||'')}</div>`;
    log.scrollTop = log.scrollHeight;

    // Bir sonrakine geçmeden önce bekle
    await new Promise(r => setTimeout(r, 3000));
  }

  bar.style.width = '100%';
  txt.textContent = cancelFlag ? 'İptal edildi.' : `${indices.length} kitap tamamlandı!`;
  setTimeout(() => modal.classList.remove('show'), 2500);
}

function cancelDownload() {
  cancelFlag = true;
  document.getElementById('progress-modal').classList.remove('show');
}

function downloadOne(i) {
  const b = currentBooks[i];
  if (!b) return;
  const btn = document.getElementById(`dl-${i}`);
  if (btn) { btn.textContent = '⏳'; btn.classList.add('loading'); }
  const iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = `/api/download?${buildParams(b)}`;
  document.body.appendChild(iframe);
  setTimeout(() => {
    if (btn) { btn.textContent = '✓ İndirildi'; btn.classList.remove('loading'); btn.classList.add('done'); }
  }, 4000);
}

function changePage(dir) {
  currentPage += dir;
  if (currentPage < 1) currentPage = 1;
  doSearch(currentPage);
  window.scrollTo(0,0);
}
</script>
</body>
</html>
